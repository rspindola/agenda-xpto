services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda_xpto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda_xpto}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_xpto}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenda_xpto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-agenda_xpto}\" -d \"${POSTGRES_DB:-agenda_xpto}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - agenda_xpto_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  agenda_xpto_pg_data:
  agenda_xpto_redis_data:
